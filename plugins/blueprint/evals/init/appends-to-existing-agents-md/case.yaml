# Goal: Checks that when AGENTS.md already holds the project's own instructions, /blueprint:init appends the blueprint section after them exactly once, keeps the existing text unchanged, and creates no CLAUDE.md file anywhere.
schema_version: "1.1"
name: appends-to-existing-agents-md
expected_outcome: |
  AGENTS.md still begins with its original text, unchanged, followed by one copy of the blueprint section between its markers. No CLAUDE.md exists, neither in the project root nor in .claude/.
context:
  scaffold_script: setup.sh
