# Goal: Checks that outside a git repository /workflow:init creates .handoff/.gitignore containing * in the current directory and replies with exactly the Created line.
schema_version: "1.1"
name: outside-git-repo
expected_outcome: |
  The agent replies with exactly one line, `Created <path>.`, where <path> is .handoff/.gitignore in the current directory. That file contains `*`. No tools are called.
context:
  scaffold_script: setup.sh
