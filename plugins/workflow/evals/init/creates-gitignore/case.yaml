# Goal: Checks that in a git repository with no .handoff/, /workflow:init creates .handoff/.gitignore containing *, replies with exactly the Created line, and calls no tools.
schema_version: "1.1"
name: creates-gitignore
expected_outcome: |
  The agent replies with exactly one line, `Created <path>.`, where <path> is the absolute path of .handoff/.gitignore at the repository root. That file contains `*`. No tools are called.
context:
  scaffold_script: setup.sh
