# Goal: Checks that with no .handoff/.gitignore, in a session with something to hand off, no file or directory is created and the one-line reply tells the user to run /workflow:init.
schema_version: "1.1"
name: missing-gitignore-points-to-init
expected_outcome: |
  The reply is one line naming /workflow:init. No file is created and Write is never called, even though the session holds a billing decision.
context:
  scaffold_script: place-files.sh
  history_file: history.jsonl
