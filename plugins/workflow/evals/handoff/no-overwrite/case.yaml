# Goal: Checks that an existing handoff file with the same name is never written to and the new file gets a -2 suffix.
schema_version: "1.1"
name: no-overwrite
expected_outcome: |
  The scaffold places .handoff/<now>-billing.md. /handoff billing writes .handoff/<now>-billing-2.md and never writes to or edits the placed file.
context:
  scaffold_script: place-files.sh
  history_file: history.jsonl
