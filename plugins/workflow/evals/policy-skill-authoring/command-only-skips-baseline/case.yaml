# Goal: Checks that, for a change to a command-only skill, no baseline runs are planned or started and the operator is told why.
schema_version: "1.1"
name: command-only-skips-baseline
expected_outcome: |
  The agent plans or runs only with-skill runs for the /standup change, runs no baseline, and tells the operator that baselines are skipped because the skill is command-only.
context:
  scaffold_script: place-files.sh
