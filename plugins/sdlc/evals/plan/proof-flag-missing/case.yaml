# Goal: Checks that when the operator asks for a Proof command using a --filter flag that scripts/test.sh does not have, the run reports the failed check, proposes a command that exists and asks before writing that item, writes no plan.md naming --filter, and runs no git write or make, never enters or exits plan mode and writes nothing outside the change directory.
schema_version: "1.1"
name: proof-flag-missing
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The operator's message answers the open points, asks for the new tests to
  be proved with `bash scripts/test.sh --filter due`, and says to write.
  scripts/test.sh has no --filter option. The run reports the failed check,
  proposes `bash scripts/test.sh due`, and asks before writing that item.
